<title>Orbit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one full-screen game canvas. A loading screen in the game's night-sky colours covers it until the engine starts; a small name form can open on top of it. */
:root {
	--sky-top: #1c1a52;
	--sky-bottom: #5a2a8a;
	--gold: #ffd93d;
	--ink: #2a1b4d;
	--cream: #fff8ee;
	--pink: #ff7eb6;
	--green: #3ecf6e;
	--green-lip: #2b9750;
	--grey: #8e93b0;
	--grey-lip: #666b88;
	--purple: #a98bff;
	--field: #ffffff;
	--veil: rgba(15, 10, 46, 0.74);
	--track: rgba(255, 248, 238, 0.2);
	--font-display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
	color-scheme: dark;
}
html, body { height: 100%; }
body {
	background: linear-gradient(var(--sky-top), var(--sky-bottom));
	color: var(--cream);
	font-family: var(--font-display);
	font-weight: 500;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
}
#canvas { display: block; width: 100%; height: 100%; outline: none; }
#loading {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 22px;
	padding-block: 24px;
	padding-left: max(24px, env(safe-area-inset-left, 0px));
	padding-right: max(24px, env(safe-area-inset-right, 0px));
	background: linear-gradient(var(--sky-top), var(--sky-bottom));
	text-align: center;
}
#loading h1 {
	margin: 0;
	font-size: clamp(64px, 22vw, 150px);
	font-weight: 700;
	line-height: 1;
	letter-spacing: 0.02em;
	color: var(--gold);
	text-shadow: 0 0.07em 0 var(--ink);
}
.planet {
	width: 96px;
	height: 96px;
	border-radius: 50%;
	background: radial-gradient(circle at 35% 30%, #ffa8cf, var(--pink) 60%);
	border: 4px solid var(--ink);
	position: relative;
	animation: bob 1.6s ease-in-out infinite alternate;
}
.planet::before, .planet::after {
	content: "";
	position: absolute;
	top: 36px;
	width: 16px;
	height: 16px;
	border-radius: 50%;
	background: var(--ink);
	border: 5px solid var(--cream);
}
.planet::before { left: 16px; }
.planet::after { right: 16px; }
@keyframes bob { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .planet { animation: none; } }
.bar {
	width: min(320px, 100%);
	height: 18px;
	border-radius: 9px;
	background: var(--track);
	overflow: hidden;
}
#fill {
	width: 0%;
	height: 100%;
	border-radius: 9px;
	background: var(--gold);
	transition: width 0.2s linear;
}
#msg { margin: 0; font-size: 20px; max-width: 34ch; line-height: 1.35; }
#hint { margin: 0; font-size: 16px; opacity: 0.75; max-width: 34ch; line-height: 1.35; }

/* Name form: a real text box, because typing into a game canvas is unreliable on phones. */
#name-form {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	padding-block: 24px;
	padding-left: max(24px, env(safe-area-inset-left, 0px));
	padding-right: max(24px, env(safe-area-inset-right, 0px));
	background: var(--veil);
	touch-action: auto;
}
.card {
	width: min(360px, 100%);
	display: flex;
	flex-direction: column;
	gap: 14px;
	padding: 28px;
	border-radius: 30px;
	background: var(--cream);
	color: var(--ink);
	text-align: center;
	box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
}
.card label { font-size: 30px; font-weight: 700; }
.card .note { margin: 0; font-size: 16px; opacity: 0.7; }
#name-input {
	min-width: 0;
	padding: 12px;
	border: 3px solid var(--purple);
	border-radius: 16px;
	background: var(--field);
	color: var(--ink);
	font: 700 26px var(--font-display);
	text-align: center;
	-webkit-user-select: text;
	user-select: text;
}
.btn {
	padding: 12px;
	border: 0;
	border-bottom: 6px solid var(--green-lip);
	border-radius: 999px;
	background: var(--green);
	color: var(--field);
	font: 700 24px var(--font-display);
	cursor: pointer;
}
.btn.quiet { border-bottom-color: var(--grey-lip); background: var(--grey); font-size: 19px; }
.btn:active { transform: translateY(3px); border-bottom-width: 3px; }
#name-input:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>

<canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas>

<div id="loading">
	<h1>ORBIT</h1>
	<div class="planet" aria-hidden="true"></div>
	<div class="bar" id="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><div id="fill"></div></div>
	<p id="msg">Loading the game…</p>
	<p id="hint">First load is about 9 MB. Steer with the stick, tap DASH to zoom.</p>
</div>

<form id="name-form" hidden>
	<div class="card">
		<label for="name-input">Your name</label>
		<input id="name-input" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
		<p class="note">2 to 12 letters or numbers</p>
		<button type="submit" class="btn">Save</button>
		<button type="button" class="btn quiet" id="name-cancel">Cancel</button>
	</div>
</form>

<script>
// The engine file is published gzip-compressed (38 MB -> 9 MB). When the
// engine asks for index.wasm, hand it the unpacked file instead.
const ENGINE_GZ_BYTES = __ENGINE_GZ_BYTES__;
const fill = document.getElementById('fill');
const bar = document.getElementById('bar');
function setProgress(fraction) {
	const pct = Math.max(0, Math.min(100, Math.round(fraction * 100)));
	fill.style.width = pct + '%';
	bar.setAttribute('aria-valuenow', String(pct));
}
(function () {
	const realFetch = window.fetch.bind(window);
	window.fetch = async function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || String(input);
		if (/index\.pck(\?|#|$)/.test(url)) {
			// Game data (scripts, font, sounds) ships inside pck.js as base64.
			const raw = atob(window.ORBIT_PCK_B64);
			const bytes = new Uint8Array(raw.length);
			for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
			return new Response(bytes, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } });
		}
		if (!/index\.wasm(\?|#|$)/.test(url)) {
			return realFetch(input, init);
		}
		const res = await realFetch('engine.wasm');
		if (!res.ok) {
			return res;
		}
		const reader = res.body.getReader();
		const chunks = [];
		let received = 0;
		for (;;) {
			const { done, value } = await reader.read();
			if (done) break;
			chunks.push(value);
			received += value.length;
			setProgress(0.9 * received / ENGINE_GZ_BYTES);
		}
		let blob = new Blob(chunks);
		const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
		if (head[0] === 0x1f && head[1] === 0x8b) {
			if (typeof DecompressionStream === 'undefined') {
				throw new Error('This browser is too old to unpack the game. Please update it and try again.');
			}
			blob = await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
		}
		return new Response(blob, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
	};
}());
</script>
<script src="pck.js"></script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":__PCK_BYTES__,"index.wasm":__WASM_BYTES__},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
(function () {
	const loading = document.getElementById('loading');
	const msg = document.getElementById('msg');
	const hint = document.getElementById('hint');
	function fail(err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong.');
		msg.textContent = 'The game could not start: ' + text;
		hint.textContent = 'Try reloading the page, or open it in Chrome or Safari.';
		bar.hidden = true;
	}
	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length !== 0) {
		fail('this browser is missing ' + missing.join(', '));
		return;
	}
	const engine = new Engine(GODOT_CONFIG);
	engine.startGame().then(function () {
		setProgress(1);
		loading.hidden = true;
		document.getElementById('canvas').focus();
	}, fail);
}());

// Name form. The game calls window.orbitEditName(current, maxLength, callback)
// when the player taps "Edit"; callback gets the typed name, or null on cancel.
(function () {
	const form = document.getElementById('name-form');
	const input = document.getElementById('name-input');
	let done = null;
	function finish(value) {
		form.hidden = true;
		input.blur();
		document.getElementById('canvas').focus();
		const callback = done;
		done = null;
		if (callback) callback(value);
	}
	form.addEventListener('submit', function (event) {
		event.preventDefault();
		finish(input.value);
	});
	document.getElementById('name-cancel').addEventListener('click', function () { finish(null); });
	window.orbitEditName = function (current, maxLength, callback) {
		done = callback;
		input.maxLength = maxLength;
		input.value = current;
		form.hidden = false;
		input.focus();
		input.select();
	};
}());
</script>
